<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Bar chart showing lead conversion rate improving from 25 percent to 45 percent after using 1Grow">
  <rect x="0" y="0" width="1200" height="600" rx="28" fill="#FAFAF8" stroke="#E8E4DF" stroke-width="2"/>
  <text x="72" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#1A1A2E">Lead conversion rate</text>
  <text x="72" y="126" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#6B7280">Automated follow-up and tracking over 3 months</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <line x1="150" y1="150" x2="150" y2="470" stroke="#E8E4DF" stroke-width="3"/>
    <line x1="150" y1="470" x2="1080" y2="470" stroke="#E8E4DF" stroke-width="3"/>

    <rect x="330" y="280" width="210" height="190" rx="16" fill="#E3E0DA"/>
    <rect x="660" y="136" width="210" height="334" rx="16" fill="#0099FF"/>

    <text x="435" y="254" font-size="34" font-weight="700" fill="#1A1A2E" text-anchor="middle">25%</text>
    <text x="765" y="110" font-size="34" font-weight="700" fill="#1A1A2E" text-anchor="middle">45%</text>

    <text x="435" y="520" font-size="26" font-weight="600" fill="#6B7280" text-anchor="middle">Before</text>
    <text x="765" y="520" font-size="26" font-weight="600" fill="#1E5FA8" text-anchor="middle">With 1Grow</text>

    <rect x="255" y="288" width="360" height="10" rx="5" fill="#0099FF" opacity="0.85"/>
    <text x="435" y="326" font-size="22" font-weight="600" fill="#1E5FA8" text-anchor="middle">+80% more leads converted</text>
  </g>
</svg>
